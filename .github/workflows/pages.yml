name: Publish author website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and verify static website
        run: |
          mkdir _site
          cp index.html style.css favicon.svg .nojekyll _site/
          cp author.html book.html reading-room.html _site/
          cp -R assets author book reading-room _site/
          test -s _site/index.html
          test -s _site/author/index.html
          test -s _site/book/index.html
          test -s _site/reading-room/index.html
          test -s _site/assets/dawns-prevail.webp
          grep -q author-introduction _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
